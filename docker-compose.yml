services:
  hermes-desktop-web:
    build: .
    image: hermes-desktop-web:latest
    container_name: hermes-desktop-web
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      # Hermes agent backend. In the common self-host setup the agent runs on
      # the same host (hermes dashboard / hermes serve). host.docker.internal
      # resolves to the host via extra_hosts below (Linux + Docker Desktop).
      - HERMES_TARGET=${HERMES_TARGET:-host.docker.internal:9119}
      - PORT=4000
      # Filesystem door root (the Files rail / file picker). Expose a volume
      # with the directories you actually want the web UI to browse. NEVER
      # mount / or your whole home here if the UI is reachable beyond a
      # trusted network.
      - WEB_FS_ROOT=${WEB_FS_ROOT:-/workspace}
      - HERMES_TERM_CWD=${HERMES_TERM_CWD:-/workspace}
      # Desktop-plugins door. Mount a directory of plugins (each
      # <name>/plugin.js) if you use the plugin runtime; empty otherwise.
      # Host path comes from HERMES_PLUGINS_SRC (default: repo-local ./plugins).
      - HERMES_PLUGINS_DIR=${HERMES_PLUGINS_DIR:-/plugins}
      # Server-side settings store (theme/plugin prefs sync across devices).
      - HERMES_WEB_SETTINGS_FILE=/data/settings.json
    extra_hosts:
      # Linux: maps host.docker.internal → host's gateway IP. Docker Desktop
      # provides it natively; the entry is a no-op there.
      - "host.docker.internal:host-gateway"
    volumes:
      # Files door root. On a bare host the proxy defaults to the agent's home;
      # in docker WEB_FS_ROOT is /workspace, so bind the directory you actually
      # want to browse. NOTE: the container can read AND write here (the
      # terminal + file uploads target it), so never point this at / or a
      # credential-bearing tree on an untrusted network.
      - ${WEB_FS_SRC:-./workspace}:/workspace
      # Plugins door host path. Point HERMES_PLUGINS_SRC at a real plugins dir
      # (e.g. HERMES_PLUGINS_SRC=$HOME/.hermes/desktop-plugins) or drop
      # plugin folders under ./plugins. Read-only so the container cannot
      # modify your plugin sources.
      - ${HERMES_PLUGINS_SRC:-./plugins}:/plugins:ro
      # Server-side settings store (survives container recreation).
      - web-settings:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  # Server-side settings store (theme/plugin prefs, survives recreation).
  web-settings:
